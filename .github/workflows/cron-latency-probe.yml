name: cron-latency-probe
# Measures how late GitHub's scheduled runner actually fires vs the nominal cron
# slot. A dead-man's-switch is only as fast as its watcher, so this number is a
# REQUIREMENT input, not trivia. Deleted once measured.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: record fire time
        run: |
          echo "fired_at_utc=$(date -u +%FT%TZ)"
          echo "epoch=$(date -u +%s)"
